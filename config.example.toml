# Copiez ce fichier vers config.toml (non versionné) et adaptez les chemins.
# Les chemins sont ceux vus depuis WSL : /mnt/d/... pour le disque D:.

[dossiers]
# Lots finalisés, déposés par le service de scan. Jamais modifié : on y copie seulement.
source = "/mnt/d/SCAN SPED DESTINATION"
# Racine de travail permanente : lots copiés, Output/, OCR/, Pending/, Review/,
# Reports/, Archive/, ainsi que la BDD et la liste de recherche Excel.
racine = "/mnt/d/CAPTURESPED"

[traitement]
# Nombre de processus pour l'extraction des codes-barres.
processus = 6
# Secondes pendant lesquelles la taille d'un lot doit rester stable avant import.
# attente_stabilite = 5
# Lots traités autrement que par ce raccourci (les lots des anciens rapports de
# codes-barres sont reconnus seuls) : en vert dans la liste, non sélectionnables.
# Plages séparées par des virgules.
# deja_traites = "1-82, 200-472"
# À renseigner seulement si la racine contient plusieurs classeurs Excel.
# bdd = "BDD_2024_2025_2026.xlsx"
# liste = "dirty list.xlsx"

# Valeurs servant uniquement à estimer la durée affichée avant le lancement.
# [estimation]
# codes_barres = 0.3   # secondes par page (débit réel, tous processus confondus)
# ocr = 3.0            # secondes par page
# part_ocr = 0.5       # part des pages qui passent par l'OCR
